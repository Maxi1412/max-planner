<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Max Planner</title>
<style>
:root{
  --bg:#f6f3ec; --card:#ffffff; --ink:#2b2b2b; --sub:#7a7568;
  --line:#e2ddd0; --mine:#0E7490; --mine-bg:#e3f2f6; --mum:#c2410c; --mum-bg:#fdece2;
  --work:#475569; --work-bg:#e2e8f0; --meal:#8a5b00; --meal-bg:#fff0bd; --other:#7e22ce; --other-bg:#f3e8fd;
  --accent:#1d4e46; --sticky:#fff6cf; --sticky-border:#e8d98a; --flag:#d97706;
  --ok:#18794e; --ok-bg:#e5f5ec; --danger:#b42318; --danger-bg:#feeceb;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#181614; --card:#242220; --ink:#f0ede6; --sub:#a39a8a;
    --line:#3a362f; --mine-bg:#123b45; --mum-bg:#3d2115; --sticky:#3a3418; --sticky-border:#5a4f22;
    --work-bg:#2a3138; --meal-bg:#443615; --other-bg:#2e1f3d; --ok-bg:#18392a; --danger-bg:#44211f;
  }
}
:root[data-theme="dark"]{
  --bg:#181614; --card:#242220; --ink:#f0ede6; --sub:#a39a8a;
  --line:#3a362f; --mine-bg:#123b45; --mum-bg:#3d2115; --sticky:#3a3418; --sticky-border:#5a4f22;
  --work-bg:#2a3138; --meal-bg:#443615; --other-bg:#2e1f3d; --ok-bg:#18392a; --danger-bg:#44211f;
}
html,body{height:100%;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;}
button,input,select,textarea{font:inherit;}
button{touch-action:manipulation;}
header{position:sticky;top:0;padding:calc(9px + env(safe-area-inset-top,0px)) 10px 9px;background:var(--bg);border-bottom:1px solid var(--line);z-index:10;display:flex;align-items:center;gap:6px;}
h1{font-size:16px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.toggle{display:flex;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;}
.toggle button{border:none;background:none;color:var(--ink);padding:7px 9px;font-size:12px;font-weight:700;}
.toggle button.active{background:var(--accent);color:#fff;}
.circlebtn,.smallbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:700;}
.circlebtn{width:34px;height:34px;border-radius:50%;font-size:18px;line-height:1;display:grid;place-items:center;}
.addbtn{background:var(--accent);color:#fff;border-color:var(--accent);font-size:21px;}
.todaybtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:7px 9px;font-size:11px;font-weight:700;}
main{padding:12px;padding-bottom:calc(42px + env(safe-area-inset-bottom,0px));}

/* COMMON NAV */
.daynav{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.daynav button{background:var(--card);border:1px solid var(--line);border-radius:10px;min-width:36px;height:36px;font-size:17px;color:var(--ink);}
.daynav h2{margin:0;font-size:16px;flex:1;text-align:center;}

/* MONTH VIEW */
.weekday-row{display:grid;grid-template-columns:repeat(7,150px);gap:8px;margin-bottom:5px;}
.weekday-row div{font-size:11px;color:var(--sub);text-align:center;font-weight:700;text-transform:uppercase;}
#monthWrap{overflow-x:auto;padding-bottom:6px;}
#month{display:grid;grid-template-columns:repeat(7,150px);grid-auto-rows:min-content;gap:8px;}
.daycard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;min-height:76px;}
.daycard.pad{opacity:.4;}
.daycard.today{border-color:var(--accent);border-width:2px;}
.daycard .dnum{color:var(--sub);font-size:12px;margin-bottom:6px;font-weight:700;}
.preview{font-size:12px;padding:5px 6px;border-radius:6px;margin-top:4px;overflow:hidden;}
.previewTitle{display:block;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.previewTime{display:block;font-size:10px;opacity:.78;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.preview.mine{background:var(--mine-bg);color:var(--mine);}
.preview.mum{background:var(--mum-bg);color:var(--mum);font-weight:800;}
.preview.work{background:var(--work-bg);color:var(--work);font-weight:800;}
.preview.meal{background:var(--meal-bg);color:var(--meal);font-weight:800;}
.preview.other{background:var(--other-bg);color:var(--other);}
.preview.completed{text-decoration:line-through;opacity:.58;}
.preview.cancelled{text-decoration:line-through;opacity:.42;}
.more{font-size:11px;color:var(--sub);margin-top:4px;}

/* WEEK VIEW - horizontal phone-first cards */
#week{display:none;}
#weekStrip{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 3px 12px;overscroll-behavior-x:contain;scrollbar-width:none;}
#weekStrip::-webkit-scrollbar{display:none;}
.weekCard{scroll-snap-align:center;flex:0 0 calc(100vw - 42px);max-width:430px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px;min-height:62vh;}
.weekCard.today{border:2px solid var(--accent);}
.weekCardHead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:10px;}
.weekCardHead h3{font-size:20px;margin:0;}
.weekCardHead .date{font-size:13px;color:var(--sub);font-weight:700;}
.openDay{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:9px;padding:7px 10px;font-size:12px;font-weight:700;}
.weekSection{margin-top:12px;}
.weekLabel{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--sub);font-weight:800;margin-bottom:6px;}
.weekReminder{background:var(--sticky);border:1px solid var(--sticky-border);border-radius:8px;padding:8px 9px;margin:5px 0;font-size:13px;font-weight:700;}
.weekTodo{font-size:13px;padding:6px 0;border-bottom:1px dashed var(--line);}
.weekTodo.done{text-decoration:line-through;opacity:.55;}
.weekAppt{border-radius:9px;padding:8px 10px;margin:6px 0;font-size:13px;display:block;}
.weekAppt.mine{background:var(--mine-bg);color:var(--mine);}
.weekAppt.mum{background:var(--mum-bg);color:var(--mum);font-weight:800;}
.weekAppt.work{background:var(--work-bg);color:var(--work);font-weight:800;}
.weekAppt.meal{background:var(--meal-bg);color:var(--meal);font-weight:800;}
.weekAppt.other{background:var(--other-bg);color:var(--other);}
.weekAppt.completed{opacity:.58;text-decoration:line-through;}
.weekAppt.cancelled{opacity:.42;text-decoration:line-through;}
.weekAppt .wkTitle{display:block;font-weight:800;line-height:1.25;}
.weekAppt .wkTime{display:block;font-size:11px;font-weight:700;opacity:.82;margin-top:2px;}
.emptyMsg{color:var(--sub);font-size:13px;padding:10px 0;}

/* DAY VIEW */
#day{display:none;}
.sticky{background:var(--sticky);border:1px solid var(--sticky-border);border-radius:8px;margin-bottom:14px;box-shadow:1px 2px 4px rgba(0,0,0,.08);display:flex;}
.stickyCol{flex:1;padding:10px 11px;min-width:0;}
.stickyCol.notesCol{border-left:1px dashed var(--sticky-border);}
.sticky h4{margin:0 0 7px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--sub);}
.itemList{display:flex;flex-direction:column;gap:5px;}
.noteItem,.todoItem{background:rgba(255,255,255,.38);border:1px solid rgba(0,0,0,.07);border-radius:7px;padding:7px 8px;font-size:13px;line-height:1.25;user-select:none;-webkit-user-select:none;}
.todoItem.completed{text-decoration:line-through;opacity:.55;}
.autoNote{font-size:13px;color:var(--mum);font-weight:800;background:rgba(255,255,255,.38);border:1px solid var(--sticky-border);border-radius:7px;padding:7px 8px;margin-bottom:5px;}
.miniAdd{display:flex;gap:5px;margin-top:7px;}
.miniAdd input{min-width:0;flex:1;padding:7px;border:1px solid var(--sticky-border);border-radius:7px;background:rgba(255,255,255,.48);color:var(--ink);font-size:12px;}
.miniAdd button{width:32px;border:none;border-radius:7px;background:var(--accent);color:#fff;font-weight:800;font-size:17px;}
#slots{position:relative;}
.slot{display:flex;border-top:1px solid var(--line);height:48px;position:relative;}
.slot:last-child{border-bottom:1px solid var(--line);}
.slot .time{width:52px;flex-shrink:0;color:var(--sub);font-size:12px;padding:9px 0;font-weight:700;}
.slot .body{flex:1;padding:5px 0;min-height:48px;position:relative;}
#spanLayer{position:absolute;left:52px;right:0;top:0;z-index:4;pointer-events:none;}
.appt.span{position:absolute;left:0;right:0;margin:2px 0;pointer-events:auto;overflow:hidden;align-items:flex-start;box-shadow:0 1px 2px rgba(0,0,0,.08);}
.appt.span .spanMain{display:block;line-height:1.25;}
.appt.span .spanDuration{display:block;font-size:11px;opacity:.82;margin-top:2px;}
.appt{border-radius:8px;padding:8px 10px;margin:2px 0;font-size:13px;display:flex;justify-content:space-between;gap:7px;align-items:flex-start;user-select:none;-webkit-user-select:none;}
.apptMain{display:block;line-height:1.25;min-width:0;}
.apptTitle{display:block;font-weight:800;white-space:normal;}
.apptTime{display:block;font-size:11px;font-weight:700;opacity:.82;margin-top:2px;}
.appt.mine{background:var(--mine-bg);color:var(--mine);}
.appt.mum{background:var(--mum-bg);color:var(--mum);font-weight:800;}
.appt.work{background:var(--work-bg);color:var(--work);font-weight:800;}
.appt.meal{background:var(--meal-bg);color:var(--meal);font-weight:800;}
.appt.other{background:var(--other-bg);color:var(--other);}
.appt.flagged{box-shadow:0 0 0 2px var(--flag) inset;}
.appt.completed{opacity:.6;text-decoration:line-through;}
.appt.cancelled{opacity:.42;text-decoration:line-through;}
.statusMark{font-size:20px;font-weight:900;line-height:1;flex-shrink:0;}
.statusMark.ok{color:var(--ok);}
.statusMark.cancel{color:var(--danger);}
.addslot{width:100%;text-align:left;background:none;border:none;color:var(--sub);font-size:12px;padding:6px 0;}

/* MODALS / SHEETS */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.44);display:none;align-items:flex-end;justify-content:center;z-index:30;}
.overlay.open{display:flex;}
.sheet{background:var(--card);width:100%;max-width:480px;border-radius:16px 16px 0 0;padding:16px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto;}
.sheet h3{margin:0 0 10px;font-size:16px;}
.sheet label{display:block;font-size:12px;color:var(--sub);margin:9px 0 3px;font-weight:700;}
.sheet input,.sheet select,.sheet textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:14px;}
.sheet textarea{min-height:80px;resize:vertical;}
.form2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.who{display:flex;gap:7px;margin-top:4px;flex-wrap:wrap;}
.who button{flex:1 1 45%;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:13px;}
.who button.sel-mine{background:var(--mine-bg);color:var(--mine);border-color:var(--mine);}
.who button.sel-mum{background:var(--mum-bg);color:var(--mum);border-color:var(--mum);}
.who button.sel-work{background:var(--work-bg);color:var(--work);border-color:var(--work);}
.who button.sel-other{background:var(--other-bg);color:var(--other);border-color:var(--other);}
.flagrow{display:flex!important;align-items:center;gap:8px;margin-top:10px!important;color:var(--ink)!important;}
.flagrow input{width:auto;}
.sheet .row{display:flex;gap:8px;margin-top:16px;}
.sheet .row button{flex:1;min-height:46px;padding:11px;border-radius:10px;border:none;font-size:14px;font-weight:700;touch-action:manipulation;}
.sheet .row.stickyActions{position:sticky;bottom:-16px;background:var(--card);padding:10px 0 calc(4px + env(safe-area-inset-bottom,0px));margin-top:14px;z-index:3;border-top:1px solid var(--line);}
.formError{display:none;margin-top:9px;padding:8px 10px;border-radius:8px;background:var(--danger-bg);color:var(--danger);font-size:12px;font-weight:700;}
.formError.show{display:block;}
.save{background:var(--accent);color:#fff;}
.cancel{background:var(--line);color:var(--ink);}
.danger{background:var(--danger-bg);color:var(--danger);}
.actionList{display:flex;flex-direction:column;gap:7px;}
.actionList button{width:100%;text-align:left;padding:13px 12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;font-size:14px;font-weight:700;}
.actionList button.good{background:var(--ok-bg);color:var(--ok);}
.actionList button.bad{background:var(--danger-bg);color:var(--danger);}
.menuList{display:flex;flex-direction:column;gap:7px;}
.menuList button{padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);text-align:left;font-weight:700;}
.recList{display:flex;flex-direction:column;gap:8px;margin-top:10px;}
.recItem{padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);}
.recItem strong{display:block;margin-bottom:3px;}
.recItem small{color:var(--sub);}
.recActions{display:flex;gap:6px;margin-top:7px;}
.recActions button{flex:1;padding:7px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font-size:12px;font-weight:700;}
.hidden{display:none!important;}

/* PRINT PREVIEW */
#printPreview{position:fixed;inset:0;background:#d9d9d9;z-index:50;display:none;overflow:auto;padding:10px;}
#printPreview.open{display:block;}
.previewBar{position:sticky;top:0;z-index:2;background:#fff;border:1px solid #bbb;border-radius:10px;padding:8px;display:flex;gap:8px;margin-bottom:10px;}
.previewBar button{flex:1;padding:10px;border:1px solid #aaa;border-radius:8px;background:#fff;color:#111;font-weight:800;}
.previewBar .primary{background:#111;color:#fff;}
#printSheet{background:#fff;color:#000;width:297mm;min-height:210mm;margin:0 auto;padding:7mm;box-shadow:0 2px 12px rgba(0,0,0,.25);transform-origin:top left;}
#printSheet h2{font-size:15pt;margin:0 0 2mm;text-align:center;}
.printWeekTable{width:100%;border-collapse:collapse;table-layout:fixed;font-size:9pt;}
.printWeekTable th,.printWeekTable td{border:1px solid #000;vertical-align:top;padding:1.2mm;}
.printWeekTable th{font-size:10pt;height:10mm;}
.printWeekTable .timeCell{width:11mm;text-align:center;font-weight:700;vertical-align:middle;}
.printWeekTable .importantRow td{height:21mm;}
.printWeekTable .hourRow td{height:10mm;}
.printEntry{margin-bottom:1mm;line-height:1.2;font-size:9pt;}
.printTime{display:block;font-size:8pt;font-weight:700;margin-top:.4mm;}
.printEntry.mum{font-weight:900;}
.printEntry.completed{text-decoration:line-through;}
.printEntry.cancelled{text-decoration:line-through;opacity:.55;}
.printFooter{font-size:7.5pt;margin-top:2mm;text-align:right;}

@media (max-width:520px){
  h1{display:none;}
  header{gap:5px;}
  .toggle{flex:1;}
  .toggle button{flex:1;padding:7px 6px;}
  .todaybtn{padding:7px 8px;}
  main{padding:10px;}
  .sticky{display:block;}
  .stickyCol.notesCol{border-left:none;border-top:1px dashed var(--sticky-border);}
}

@media print{
  @page{size:A4 landscape;margin:0;}
  body{background:#fff!important;}
  header,main,.overlay,#printPreview .previewBar{display:none!important;}
  #printPreview{display:block!important;position:static!important;background:#fff!important;padding:0!important;overflow:visible!important;}
  #printSheet{display:block!important;width:297mm!important;min-height:210mm!important;margin:0!important;padding:7mm!important;box-shadow:none!important;transform:none!important;}
}

/* PWA install/update controls */
.pwaHidden{display:none!important;}
#updateBanner{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:80;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:0 6px 24px rgba(0,0,0,.18);display:none;align-items:center;gap:10px;}
#updateBanner.show{display:flex;}
#updateBanner span{flex:1;font-size:13px;font-weight:700;}
#updateBanner button{border:none;border-radius:9px;background:var(--accent);color:#fff;padding:8px 11px;font-weight:700;}
.pwaMeta{font-size:11px;color:var(--sub);text-align:center;margin-top:8px;}
</style>

<meta name="theme-color" content="#1d4e46">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Max Planner">
<link rel="manifest" href="./app.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
</head>
<body>
<header>
  <h1>Planner</h1>
  <div class="toggle">
    <button id="btnMonth">Month</button>
    <button id="btnWeek">Week</button>
    <button id="btnDay" class="active">Day</button>
  </div>
  <button type="button" class="todaybtn" id="todayBtn">Today</button>
  <button type="button" class="circlebtn addbtn" id="addBtn" aria-label="Add appointment">+</button>
  <button type="button" class="circlebtn" id="menuBtn" aria-label="Menu">⋮</button>
</header>

<main>
  <section id="monthSection" style="display:none;">
    <div class="daynav" id="monthnav">
      <button id="prevMonth">‹</button>
      <h2 id="monthTitle"></h2>
      <button id="nextMonth">›</button>
    </div>
    <div id="monthWrap">
      <div class="weekday-row"><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div><div>Sun</div></div>
      <div id="month"></div>
    </div>
  </section>

  <section id="week">
    <div class="daynav">
      <button id="prevWeek">‹</button>
      <h2 id="weekTitle"></h2>
      <button id="nextWeek">›</button>
    </div>
    <div id="weekStrip"></div>
  </section>

  <section id="day">
    <div class="daynav">
      <button id="prevDay">‹</button>
      <h2 id="dayTitle"></h2>
      <button id="nextDay">›</button>
    </div>

    <div class="sticky">
      <div class="stickyCol">
        <h4>To do</h4>
        <div id="todoList" class="itemList"></div>
        <div class="miniAdd">
          <input id="todoInput" placeholder="Add to-do…">
          <button id="todoAdd" aria-label="Add to-do">+</button>
        </div>
      </div>
      <div class="stickyCol notesCol">
        <h4>Notes / important</h4>
        <div id="autoNotes"></div>
        <div id="noteList" class="itemList"></div>
        <div class="miniAdd">
          <input id="noteInput" placeholder="Add note…">
          <button id="noteAdd" aria-label="Add note">+</button>
        </div>
      </div>
    </div>
    <div id="slots"></div>
  </section>
</main>

<!-- Appointment modal -->
<div id="apptModal" class="overlay"><div class="sheet">
  <h3 id="apptModalTitle">Add appointment</h3>
  <label>Date</label>
  <input id="fDate" type="date">
  <div class="form2">
    <div><label>Start</label><select id="fStart"></select></div>
    <div><label>End (optional)</label><select id="fEnd"></select></div>
  </div>
  <label>What</label>
  <input id="fTitle" placeholder="e.g. Lunch with Mum">
  <label>For</label>
  <div class="who">
    <button type="button" id="whoMine" class="sel-mine">Me</button>
    <button type="button" id="whoMum">Mum</button>
    <button type="button" id="whoWork">Work</button>
    <button type="button" id="whoOther">Other</button>
  </div>
  <label>Type</label>
  <select id="fCategory">
    <option value="auto">Auto</option>
    <option value="general">General</option>
    <option value="meal">Meal / food</option>
  </select>
  <label class="flagrow"><input type="checkbox" id="fFlag"> Important / can't forget ★</label>
  <label>Repeat</label>
  <select id="fRepeat">
    <option value="none">Does not repeat</option>
    <option value="daily">Every day</option>
    <option value="weekly">Every week</option>
    <option value="interval">Every X days</option>
  </select>
  <div id="repeatEveryWrap" class="hidden">
    <label>Repeat every how many days?</label>
    <input id="fInterval" type="number" min="2" max="365" value="3">
  </div>
  <div id="apptError" class="formError" role="alert"></div>
  <div class="row stickyActions">
    <button type="button" class="cancel" id="apptCancel">Cancel</button>
    <button type="button" class="save" id="apptSave">Save</button>
  </div>
</div></div>

<!-- Action sheet -->
<div id="actionModal" class="overlay"><div class="sheet">
  <h3 id="actionTitle">Actions</h3>
  <div id="actionList" class="actionList"></div>
  <div class="row"><button type="button" class="cancel" id="actionClose">Close</button></div>
</div></div>

<!-- Simple text editor -->
<div id="textModal" class="overlay"><div class="sheet">
  <h3 id="textModalTitle">Edit</h3>
  <textarea id="textValue"></textarea>
  <div class="row">
    <button type="button" class="cancel" id="textCancel">Cancel</button>
    <button type="button" class="save" id="textSave">Save</button>
  </div>

const MONTHNAMES=['January','February','March','April','May','June','July','August','September','October','November','December'];
const DAYNAMES=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];

try{ data=JSON.parse(localStorage.getItem(DATA_KEY)||'{}'); }catch(e){ data={}; }

let meta={disabledDefaults:[]};

if(!Array.isArray(meta.disabledDefaults)) meta.disabledDefaults=[];

function uid(prefix='i'){ return prefix+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7); }
function pad(n){return n<10?'0'+n:n;}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parseIso(s){const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d);}
function cloneDate(d){const x=new Date(d);x.setHours(0,0,0,0);return x;}
function startOfWeek(d){const x=cloneDate(d);const day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);return x;}
function dateAdd(d,n){const x=cloneDate(d);x.setDate(x.getDate()+n);return x;}
function dayIndex(d){return (d.getDay()+6)%7;}
function minutes(t){ if(!t) return 99999; const [h,m]=t.split(':').map(Number); return h*60+m; }
function fmtTime(t){return t||'';}
function timeRange(a){return a.end && a.end!==a.start ? `${a.start}–${a.end}` : a.start;}
function whoLabel(w){return ({mine:'Me',mum:'Mum',work:'Work',other:'Other'})[w]||'';}
function appointmentRoleSuffix(a){
  const title=String(a?.title||'').toLowerCase();
  if(a?.who==='mum' && !/\b(mum|mama|mother)\b/.test(title)) return ' · Mum';
  if(a?.who==='work' && !/\bwork(?:ing)?\b/.test(title)) return ' · Work';
  if(a?.who==='other' && !/\bother\b/.test(title)) return ' · Other';
  return '';
}
function appointmentVisualClass(a){
  if(a.who==='mum') return 'mum';
  if(a.who==='work') return 'work';
  const title=String(a.title||'');
  const autoMeal=/\b(breakfast|brunch|lunch|dinner|meal|sushi|restaurant|eat|food)\b/i.test(title);
  if(a.category==='meal' || (a.category!=='general' && autoMeal)) return 'meal';
  return a.who||'mine';
}
function durationMinutes(a){
  if(!a.start||!a.end) return 0;
  const start=minutes(a.start),end=minutes(a.end);
  return end>start?end-start:0;
}
function isSpanningAppointment(a){return durationMinutes(a)>=60;}
function repeatLabel(r){
  if(r.repeat==='daily') return 'Every day';
  if(r.repeat==='weekly') return 'Every week';
  if(r.repeat==='interval') return `Every ${r.interval||3} days`;
  return 'Does not repeat';
}
function save(){
  try{localStorage.setItem(DATA_KEY,JSON.stringify(data));localStorage.setItem(RECUR_KEY,JSON.stringify(recurring));localStorage.setItem(META_KEY,JSON.stringify(meta));}catch(e){}
}
function dayData(key){ if(!data[key]) data[key]={appts:[],todos:[],noteItems:[]}; migrateDay(data[key]); return data[key]; }

function inferDurationMinutes(title){
  const s=String(title||'').trim();
  if(/\bwalk(?:\s+the)?\s+dog\b|\bdog\s+needs\s+walk\b/i.test(s)) return 60;
  if(/\bbreakfast\b/i.test(s)) return 30;
  if(/[½]/.test(s) && /(?:h|hr|hour)/i.test(s)) return 30;
  if(/[¼]/.test(s) && /(?:h|hr|hour)/i.test(s)) return 15;
  if(/[¾]/.test(s) && /(?:h|hr|hour)/i.test(s)) return 45;
  const hours=s.match(/(\d+(?:[.,]\d+)?)\s*(?:h|hr|hrs|hour|hours)\b/i);
  if(hours){
    const mins=Math.round(Number(hours[1].replace(',','.'))*60);
    if(mins>0 && mins%15===0) return mins;
  }
  const mins=s.match(/(\d+)\s*(?:min|mins|minute|minutes)\b/i);
  if(mins){
    const n=Number(mins[1]);
    if(n>0 && n%15===0) return n;
  }
  return 0;
}
function inferredEndTime(start,title){
  const dur=inferDurationMinutes(title);
  if(!dur||!start) return '';
  const base=minutes(normalizeTime(start));
  if(base===99999) return '';
  const total=base+dur;
  if(total>=24*60) return '';
  return pad(Math.floor(total/60))+':'+pad(total%60);
}

function migrateDay(dd){
  if(!Array.isArray(dd.appts)) dd.appts=[];
  dd.appts.forEach(a=>{ if(!a.id)a.id=uid('a'); if(!a.start)a.start=a.time||'09:00'; a.start=normalizeTime(a.start); if(a.end===undefined)a.end=''; a.end=normalizeTime(a.end); if(!a.end){const inferred=inferredEndTime(a.start,a.title);if(inferred)a.end=inferred;} if(!a.status)a.status='pending'; if(a.category===undefined)a.category='auto'; });
  if(!Array.isArray(dd.todos)){
    dd.todos=(dd.todo||'').split('\n').map(x=>x.trim()).filter(Boolean).map(text=>({id:uid('t'),text,status:'pending'}));
  }
  dd.todos.forEach(t=>{if(!t.id)t.id=uid('t');if(!t.status)t.status='pending';});
  if(!Array.isArray(dd.noteItems)){
    dd.noteItems=(dd.notes||'').split('\n').map(x=>x.trim()).filter(Boolean).map(text=>({id:uid('n'),text}));
  }
  if(!dd.recurringStatus) dd.recurringStatus={};
  if(!dd.recurringHidden) dd.recurringHidden={};
  if(!dd.defaultStatus) dd.defaultStatus={};
}
Object.keys(data).forEach(k=>migrateDay(data[k]));
recurring.forEach(r=>{
  if(r.type==='appointment'){
    r.start=normalizeTime(r.start||'');
    r.end=normalizeTime(r.end||'');
    if(!r.end){

});

};

// V4: consolidate Max's confirmed work roster into one continuous 19:00–23:00 block.
if(!meta.workScheduleV4Applied){
  const rosterDates=['2026-09-26','2026-09-27','2026-09-28','2026-09-29','2026-09-30','2026-10-01','2026-10-02','2026-10-03','2026-10-04'];

let today=cloneDate(new Date());
let current=new Date(today);
let mode='day';
let whoSel='mine';
let editingAppt=null;
let editingApptKey=null;
let editingSeriesId=null;

function recurrenceDue(r,d){
  if(!r.startDate) return false;
  const start=parseIso(r.startDate); const target=cloneDate(d);
  const diff=Math.round((target-start)/86400000);
  if(diff<0) return false;
  if(r.repeat==='daily') return true;
  if(r.repeat==='weekly') return diff%7===0;
  if(r.repeat==='interval') return diff%(Number(r.interval)||3)===0;
  return false;
}
function recurringForDate(d,type){
  const key=iso(d); const dd=dayData(key);
  return recurring.filter(r=>r.type===type && recurrenceDue(r,d) && !dd.recurringHidden[r.id]).map(r=>({
    id:'rec-'+r.id+'-'+key,seriesId:r.id,isRecurring:true,title:r.title,who:r.who||'mine',flag:!!r.flag,
    start:r.start||'',end:r.end||'',category:r.category||'auto',status:dd.recurringStatus[r.id]||'pending'
  }));
}
function mergedAppts(key){
  const dd=dayData(key);
  const removed=dd.removedDefaults||[];
  const disabled=meta.disabledDefaults||[];
  const defs=DEFAULTS.filter(def=>!disabled.includes(def.id) && !removed.includes(def.id) && !dd.appts.some(a=>normalizeTime(a.start)===def.start && a.title===def.title)).map(def=>({...def,id:def.id+'-'+key,defaultId:def.id,isDefault:true,status:dd.defaultStatus[def.id]||'pending'}));
  const rec=recurringForDate(parseIso(key),'appointment').filter(r=>!dd.appts.some(a=>normalizeTime(a.start)===normalizeTime(r.start) && a.title===r.title));
  return dd.appts.concat(defs,rec).sort((a,b)=>minutes(a.start)-minutes(b.start));
}
function recurringNotes(key){return recurringForDate(parseIso(key),'reminder');}
function statusMark(a){
  if(a.status==='completed') return '<span class="statusMark ok">✓</span>';

}

function renderMonth(){
  document.getElementById('monthTitle').textContent=MONTHNAMES[current.getMonth()]+' '+current.getFullYear();
  const first=new Date(current.getFullYear(),current.getMonth(),1);
  const gridStart=startOfWeek(first);
  const last=new Date(current.getFullYear(),current.getMonth()+1,0);
  const gridEnd=dateAdd(startOfWeek(last),6);
  const el=document.getElementById('month');el.innerHTML='';
  for(let d=new Date(gridStart);d<=gridEnd;d.setDate(d.getDate()+1)){
    const date=new Date(d); const key=iso(date); const inMonth=date.getMonth()===current.getMonth();
    const card=document.createElement('div');
    card.className='daycard'+(key===iso(today)?' today':'')+(inMonth?'':' pad');
    card.innerHTML=`<div class="dnum">${date.getDate()}</div>`;
    const list=mergedAppts(key);
    list.slice(0,3).forEach(a=>{
      const p=document.createElement('div');
      p.className='preview '+appointmentVisualClass(a)+' '+(a.status||'');
      const mark=(a.status==='completed'?'✓ ':a.status==='cancelled'?'✕ ':'')+(a.flag?'★ ':'');
      p.innerHTML=`<span class="previewTitle">${mark}${escapeHtml(a.title)}${appointmentRoleSuffix(a)}</span><span class="previewTime">${timeRange(a)}</span>`;
      card.appendChild(p);
    });
    const noteCount=recurringNotes(key).length;
    if(noteCount){const n=document.createElement('div');n.className='more';n.textContent='★ '+noteCount+' reminder'+(noteCount>1?'s':'');card.appendChild(n);}
    if(list.length>3){const m=document.createElement('div');m.className='more';m.textContent='+'+(list.length-3)+' more';card.appendChild(m);}
    card.onclick=()=>{current=new Date(date);mode='day';render();};
    el.appendChild(card);
  }
}

function renderWeek(){
  const ws=startOfWeek(current); const we=dateAdd(ws,6);
  document.getElementById('weekTitle').textContent=`${ws.getDate()} ${MONTHNAMES[ws.getMonth()].slice(0,3)} – ${we.getDate()} ${MONTHNAMES[we.getMonth()].slice(0,3)}`;
  const strip=document.getElementById('weekStrip');strip.innerHTML='';
  for(let i=0;i<7;i++){
    const d=dateAdd(ws,i); const key=iso(d); const dd=dayData(key);
    const card=document.createElement('div');card.className='weekCard'+(key===iso(today)?' today':''); card.dataset.key=key;
    const head=document.createElement('div');head.className='weekCardHead';
    head.innerHTML=`<div><h3>${DAYNAMES[i]}</h3><div class="date">${d.getDate()} ${MONTHNAMES[d.getMonth()]} ${d.getFullYear()}</div></div><button class="openDay">Open day</button>`;
    head.querySelector('.openDay').onclick=()=>{current=new Date(d);mode='day';render();};
    card.appendChild(head);

    const notes=recurringNotes(key).filter(n=>n.status!=='cancelled');
    if(notes.length || dd.noteItems.length){
      const sec=document.createElement('div');sec.className='weekSection';sec.innerHTML='<div class="weekLabel">Important / notes</div>';
      notes.forEach(n=>{const x=document.createElement('div');x.className='weekReminder';x.textContent=(n.flag?'★ ':'')+n.title;attachLongPress(x,()=>recurringReminderActions(n,key),()=>{const r=recurring.find(z=>z.id===n.seriesId);if(r)openRecurringEditor(r);});sec.appendChild(x);});
      dd.noteItems.forEach(n=>{const x=document.createElement('div');x.className='weekReminder';x.textContent=n.text;attachLongPress(x,()=>noteActions(n,key),()=>editTextItem('note',n,key));sec.appendChild(x);});
      card.appendChild(sec);
    }

    if(dd.todos.length){
      const sec=document.createElement('div');sec.className='weekSection';sec.innerHTML='<div class="weekLabel">To do</div>';
      dd.todos.forEach(t=>{const x=document.createElement('div');x.className='weekTodo'+(t.status==='completed'?' done':'');x.textContent=(t.status==='completed'?'✓ ':'□ ')+t.text;attachLongPress(x,()=>todoActions(t,key),()=>editTextItem('todo',t,key));sec.appendChild(x);});
      card.appendChild(sec);
    }

    const appts=mergedAppts(key);
    const sec=document.createElement('div');sec.className='weekSection';sec.innerHTML='<div class="weekLabel">Appointments</div>';
    if(!appts.length){const e=document.createElement('div');e.className='emptyMsg';e.textContent='No appointments';sec.appendChild(e);}
    appts.forEach(a=>{
      const x=document.createElement('div');x.className='weekAppt '+appointmentVisualClass(a)+' '+(a.status||'');
      const mark=(a.status==='completed'?'✓ ':a.status==='cancelled'?'✕ ':'')+(a.flag?'★ ':'');
      x.innerHTML=`<span class="wkTitle">${mark}${escapeHtml(a.title)}${appointmentRoleSuffix(a)}</span><span class="wkTime">${timeRange(a)}</span>`;
      attachLongPress(x,()=>appointmentActions(a,key),()=>editAppointment(a,key));
      sec.appendChild(x);
    });
    card.appendChild(sec);
    strip.appendChild(card);
  }
  requestAnimationFrame(()=>{
    const idx=(current>=ws && current<=we)?dayIndex(current):0;
    const card=strip.children[idx]; if(card) card.scrollIntoView({behavior:'auto',inline:'center',block:'nearest'});
  });
}

function renderDay(){
  const key=iso(current); const dd=dayData(key); const idx=dayIndex(current);
  document.getElementById('dayTitle').textContent=DAYNAMES[idx]+' '+current.getDate()+'/'+pad(current.getMonth()+1);
  renderTodos(key); renderNotes(key);
  const slots=document.getElementById('slots');slots.innerHTML='';
  const appts=mergedAppts(key);
  VISUAL_HOURS.forEach(h=>{
    const row=document.createElement('div');row.className='slot';
    const t=document.createElement('div');t.className='time';t.textContent=pad(h)+':00';
    const b=document.createElement('div');b.className='body';
    appts.filter(a=>!isSpanningAppointment(a) && Number((a.start||'0').split(':')[0])===h).forEach(a=>{
      const ap=document.createElement('div');ap.className='appt '+appointmentVisualClass(a)+(a.flag?' flagged':'')+' '+(a.status||'');
      const mark=a.flag?'★ ':'';
      ap.innerHTML=`<span class="apptMain"><span class="apptTitle">${mark}${escapeHtml(a.title)}${appointmentRoleSuffix(a)}</span><span class="apptTime">${timeRange(a)}</span></span>${statusMark(a)}`;
      attachLongPress(ap,()=>appointmentActions(a,key),()=>editAppointment(a,key));
      b.appendChild(ap);
    });
    const add=document.createElement('button');add.className='addslot';add.textContent='+ add';
    add.onclick=()=>openAppointmentModal(null,key,pad(h)+':00');
    b.appendChild(add);
    row.append(t,b);slots.appendChild(row);
  });
  renderSpanningAppointments(appts,key,slots);
}

function renderSpanningAppointments(appts,key,slots){
  const visualStart=VISUAL_HOURS[0]*60;
  const visualEnd=(VISUAL_HOURS[VISUAL_HOURS.length-1]+1)*60;
  const pxPerHour=48;
  const spans=appts.filter(isSpanningAppointment)
    .filter(a=>minutes(a.start)<visualEnd && minutes(a.end)>visualStart)
    .sort((a,b)=>minutes(a.start)-minutes(b.start)||minutes(a.end)-minutes(b.end));
  if(!spans.length)return;

  // Split overlapping appointments into groups, then place each group in side-by-side columns.
  const groups=[];
  let group=[]; let groupEnd=-1;
  spans.forEach(a=>{
    const s=minutes(a.start),e=minutes(a.end);
    if(group.length && s>=groupEnd){groups.push(group);group=[];groupEnd=-1;}
    group.push(a);groupEnd=Math.max(groupEnd,e);
  });
  if(group.length)groups.push(group);

  const layout=new Map();
  groups.forEach(items=>{
    const colEnds=[];
    let maxCols=1;
    items.forEach(a=>{
      const s=minutes(a.start),e=minutes(a.end);
      let col=colEnds.findIndex(end=>end<=s);
      if(col<0){col=colEnds.length;colEnds.push(e);} else colEnds[col]=e;
      maxCols=Math.max(maxCols,colEnds.length);
      layout.set(a,{col,cols:0});
    });
    items.forEach(a=>layout.get(a).cols=maxCols);
  });

  const layer=document.createElement('div');
  layer.id='spanLayer';
  layer.style.height=(VISUAL_HOURS.length*pxPerHour)+'px';
  spans.forEach(a=>{
    const clippedStart=Math.max(minutes(a.start),visualStart);
    const clippedEnd=Math.min(minutes(a.end),visualEnd);
    const top=((clippedStart-visualStart)/60)*pxPerHour;
    const height=Math.max(34,((clippedEnd-clippedStart)/60)*pxPerHour-4);
    const pos=layout.get(a)||{col:0,cols:1};
    const gap=4;
    const ap=document.createElement('div');
    ap.className='appt span '+appointmentVisualClass(a)+(a.flag?' flagged':'')+' '+(a.status||'');
    ap.style.top=(top+2)+'px';
    ap.style.height=height+'px';
    ap.style.right='auto';
    ap.style.left=`calc(${(pos.col/pos.cols)*100}% + ${pos.col?gap/2:0}px)`;
    ap.style.width=`calc(${100/pos.cols}% - ${pos.cols>1?gap/2:0}px)`;
    ap.innerHTML=`<span class="spanMain"><strong>${a.flag?'★ ':''}${escapeHtml(a.title)}${appointmentRoleSuffix(a)}</strong><span class="spanDuration">${timeRange(a)}</span></span>${statusMark(a)}`;
    attachLongPress(ap,()=>appointmentActions(a,key),()=>editAppointment(a,key));
    layer.appendChild(ap);
  });
  slots.appendChild(layer);
}

function escapeHtml(s){return String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function attachLongPress(el,onLong,onTap){
  let timer=null,startX=0,startY=0,longDone=false,moved=false;
  const clear=()=>{if(timer){clearTimeout(timer);timer=null;}};
  el.style.cursor='pointer';
  el.addEventListener('pointerdown',e=>{
    longDone=false;moved=false;startX=e.clientX;startY=e.clientY;clear();
    timer=setTimeout(()=>{longDone=true;onLong();navigator.vibrate?.(25);},550);
  });
  el.addEventListener('pointermove',e=>{if(Math.abs(e.clientX-startX)>10||Math.abs(e.clientY-startY)>10){moved=true;clear();}});
  el.addEventListener('pointerup',()=>clear());
  el.addEventListener('pointercancel',()=>{moved=true;clear();});
  el.addEventListener('click',e=>{
    if(longDone||moved){e.preventDefault();e.stopPropagation();longDone=false;return;}
    onTap();
  });
}

function validateAppointmentInput(){

  if(!title) return {error:'Please enter an appointment name.'};

  if(!start) return {error:'Please choose a start time.'};

function saveAppointmentFromModal(){
  clearApptError();
  const v=validateAppointmentInput();
  if(v.error){showApptError(v.error);return false;}
  const {title,date,start,end}=v;
  const repeat=document.getElementById('fRepeat').value;
  const flag=document.getElementById('fFlag').checked;
  const category=document.getElementById('fCategory').value||'auto';
  const interval=repeat==='interval'?Math.max(2,Number(document.getElementById('fInterval').value)||3):undefined;

  if(pendingReschedule){
    const ctx=pendingReschedule;
    if(ctx.kind==='recurring') dayData(ctx.key).recurringStatus[ctx.seriesId]='cancelled';
    else if(ctx.kind==='default') dayData(ctx.key).defaultStatus[ctx.defaultId]='cancelled';
    else {
      const original=dayData(ctx.key).appts.find(x=>x.id===ctx.id);
      if(original) original.status='cancelled';
    }
    const clean={id:uid('a'),start,end,title,who:whoSel,category,flag,status:'pending'};
    dayData(date).appts.push(clean);
    pendingReschedule=null;editingAppt=null;editingApptKey=null;editingSeriesId=null;
  }else if(editingSeriesId){
    if(repeat==='none'){
      recurring=recurring.filter(x=>x.id!==editingSeriesId);
      dayData(date).appts.push({id:uid('a'),start,end,title,who:whoSel,category,flag,status:'pending'});
    }else{
      recurring=recurring.map(r=>r.id===editingSeriesId?{...r,type:'appointment',title,who:whoSel,category,flag,startDate:date,start,end,repeat,interval}:r);
    }
  }else if(editingAppt){
    const old=dayData(editingApptKey);
    if(editingAppt.isDefault){
      const defId=editingAppt.defaultId||editingAppt.id.split('-')[0];
      if(repeat==='none') old.removedDefaults=[...new Set([...(old.removedDefaults||[]),defId])];
      else meta.disabledDefaults=[...new Set([...(meta.disabledDefaults||[]),defId])];
    }else{
      old.appts=old.appts.filter(x=>x.id!==editingAppt.id);
    }
    if(repeat==='none'){
      dayData(date).appts.push({id:editingAppt.isDefault?uid('a'):editingAppt.id,start,end,title,who:whoSel,category,flag,status:editingAppt.status||'pending'});
    }else{
      recurring.push({id:uid('r'),type:'appointment',title,who:whoSel,category,flag,startDate:date,start,end,repeat,interval});
    }
  }else if(repeat!=='none'){
    recurring.push({id:uid('r'),type:'appointment',title,who:whoSel,category,flag,startDate:date,start,end,repeat,interval});
  }else{
    dayData(date).appts.push({id:uid('a'),start,end,title,who:whoSel,category,flag,status:'pending'});
  }
  current=parseIso(date);
  save();
  document.getElementById('apptModal').classList.remove('open');
  render();
  return true;
}

// Backup / restore
function exportBackup(){
  const payload={app:'Max Planner',version:VERSION,exportedAt:new Date().toISOString(),data,recurring,meta};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='max-planner-backup-'+iso(new Date())+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function restoreBackup(file){
  const reader=new FileReader();reader.onload=()=>{try{const p=JSON.parse(reader.result);if(!p||typeof p.data!=='object')throw new Error('Invalid backup');data=p.data;recurring=Array.isArray(p.recurring)?p.recurring:[];meta=p.meta&&typeof p.meta==='object'?p.meta:{disabledDefaults:[]};if(!Array.isArray(meta.disabledDefaults))meta.disabledDefaults=[];Object.keys(data).forEach(k=>migrateDay(data[k]));save();document.getElementById('menuModal').classList.remove('open');render();alert('Backup restored.');}catch(e){alert('That file is not a valid planner backup.');}};reader.readAsText(file);
}

}
function buildPrintWeek(){
  const ws=startOfWeek(current),we=dateAdd(ws,6);const sheet=document.getElementById('printSheet');
  let html=`<h2>Mum's Weekly Plan · ${ws.getDate()} ${MONTHNAMES[ws.getMonth()]} – ${we.getDate()} ${MONTHNAMES[we.getMonth()]} ${we.getFullYear()}</h2>`;
  html+='<table class="printWeekTable"><thead><tr><th class="timeCell">Time</th>';
  for(let i=0;i<7;i++){const d=dateAdd(ws,i);html+=`<th>${DAYNAMES[i].slice(0,3).toUpperCase()}<br>${d.getDate()}/${pad(d.getMonth()+1)}</th>`;}html+='</tr></thead><tbody>';

  // Fridge print is intentionally Mum-focused: medication/important reminders only.
  // Personal notes and Max's to-do list stay in the phone planner and are not printed.
  html+='<tr class="importantRow"><td class="timeCell">Mum reminders</td>';
  for(let i=0;i<7;i++){
    const d=dateAdd(ws,i),key=iso(d);let cell='';
    recurringNotes(key)
      .filter(n=>n.who==='mum' && n.status!=='cancelled')
      .forEach(n=>cell+=`<div class="printEntry mum">${n.status==='completed'?'✓ ':''}${n.flag?'★ ':''}<b>MUM</b> — ${escapeHtml(n.title)}</div>`);
    html+=`<td>${cell}</td>`;
  }html+='</tr>';

  VISUAL_HOURS.forEach(h=>{
    html+=`<tr class="hourRow"><td class="timeCell">${pad(h)}:00</td>`;
    for(let i=0;i<7;i++){
      const d=dateAdd(ws,i),key=iso(d);let cell='';
      mergedAppts(key)
        .filter(a=>isMumPrintAppointment(a) && Number((a.start||'0').split(':')[0])===h)
        .forEach(a=>{
          const done=a.status==='completed'?'✓ ':'';
          const star=a.flag?'★ ':'';
          if(a.who==='mum'){
            cell+=`<div class="printEntry mum ${a.status||''}">${done}${star}<b>MUM — ${escapeHtml(a.title)}</b><span class="printTime">${timeRange(a)}</span></div>`;
          }else if(a.who==='work'){
            cell+=`<div class="printEntry ${a.status||''}">${done}<b>MAX WORK</b><span class="printTime">${timeRange(a)}</span></div>`;
          }
        });
      html+=`<td>${cell}</td>`;
    }
    html+='</tr>';
  });
  html+=`</tbody></table><div class="printFooter">Mum appointments & reminders + Max work shifts · Printed ${new Date().toLocaleDateString()}</div>`;sheet.innerHTML=html;
}
function openPrintPreview(){buildPrintWeek();document.getElementById('menuModal').classList.remove('open');document.getElementById('printPreview').classList.add('open');scalePreview();}
function scalePreview(){const sheet=document.getElementById('printSheet');if(!document.getElementById('printPreview').classList.contains('open'))return;const available=window.innerWidth-20;const natural=sheet.offsetWidth;const s=Math.min(1,available/natural);sheet.style.transform=`scale(${s})`;sheet.parentElement.style.minHeight=(sheet.offsetHeight*s+70)+'px';}
window.addEventListener('resize',scalePreview);
document.getElementById('previewClose').onclick=()=>{document.getElementById('printPreview').classList.remove('open');document.getElementById('printSheet').style.transform='';};
document.getElementById('previewPrint').onclick=()=>window.print();

// Main navigation
function goToday(){today=cloneDate(new Date());current=new Date(today);render();}
document.getElementById('btnMonth').onclick=()=>{mode='month';render();};
document.getElementById('btnWeek').onclick=()=>{mode='week';render();};
document.getElementById('btnDay').onclick=()=>{mode='day';render();};
document.getElementById('todayBtn').onclick=goToday;
document.getElementById('prevMonth').onclick=()=>{current.setMonth(current.getMonth()-1);render();};
document.getElementById('nextMonth').onclick=()=>{current.setMonth(current.getMonth()+1);render();};
document.getElementById('prevWeek').onclick=()=>{current.setDate(current.getDate()-7);render();};
document.getElementById('nextWeek').onclick=()=>{current.setDate(current.getDate()+7);render();};
document.getElementById('prevDay').onclick=()=>{current.setDate(current.getDate()-1);render();};
document.getElementById('nextDay').onclick=()=>{current.setDate(current.getDate()+1);render();};
document.getElementById('addBtn').onclick=()=>{if(mode!=='day'){mode='day';render();}openAppointmentModal(null,iso(current),'09:00');};

// Day swipe left/right
let touchX=0,touchY=0;const dayEl=document.getElementById('day');
dayEl.addEventListener('touchstart',e=>{touchX=e.touches[0].clientX;touchY=e.touches[0].clientY;},{passive:true});
dayEl.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-touchX,dy=e.changedTouches[0].clientY-touchY;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){current.setDate(current.getDate()+(dx<0?1:-1));render();}},{passive:true});

// Menu
document.getElementById('menuBtn').onclick=()=>document.getElementById('menuModal').classList.add('open');
document.getElementById('menuClose').onclick=()=>document.getElementById('menuModal').classList.remove('open');
document.getElementById('printWeekBtn').onclick=openPrintPreview;
document.getElementById('backupBtn').onclick=()=>{exportBackup();document.getElementById('menuModal').classList.remove('open');};
document.getElementById('restoreBtn').onclick=()=>document.getElementById('restoreFile').click();
document.getElementById('restoreFile').onchange=e=>{if(e.target.files?.[0])restoreBackup(e.target.files[0]);e.target.value='';};
document.getElementById('recurringBtn').onclick=()=>{document.getElementById('menuModal').classList.remove('open');renderRecurringManager();document.getElementById('recurringModal').classList.add('open');};
document.getElementById('recClose').onclick=()=>document.getElementById('recurringModal').classList.remove('open');
document.getElementById('recAdd').onclick=()=>openRecurringEditor(null);

// Close modal when tapping backdrop
['apptModal','actionModal','textModal','menuModal','recurringModal','recEditModal'].forEach(id=>document.getElementById(id).addEventListener('click',e=>{
  if(e.target.id===id){
    if(id==='apptModal'){pendingReschedule=null;clearApptError();}
    e.currentTarget.classList.remove('open');
  }
}));

// PWA install + seamless code updates. Planner data remains in origin storage across app updates.
let deferredInstallPrompt=null;
const installBtn=document.getElementById('installBtn');
const updateBanner=document.getElementById('updateBanner');
const applyUpdateBtn=document.getElementById('applyUpdateBtn');
const pwaBuildLabel=document.getElementById('pwaBuildLabel');
if(pwaBuildLabel) pwaBuildLabel.textContent='Max Planner · '+APP_BUILD;

window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();
  deferredInstallPrompt=e;
  if(installBtn) installBtn.classList.remove('pwaHidden');
});
window.addEventListener('appinstalled',()=>{
  deferredInstallPrompt=null;
  if(installBtn) installBtn.classList.add('pwaHidden');
});
if(installBtn){
  installBtn.onclick=async()=>{
    if(!deferredInstallPrompt){
      alert('Use your browser menu and choose “Install app” or “Add to Home screen”.');
      return;
    }
    deferredInstallPrompt.prompt();
    try{ await deferredInstallPrompt.userChoice; }catch(e){}
    deferredInstallPrompt=null;
    installBtn.classList.add('pwaHidden');
    document.getElementById('menuModal').classList.remove('open');
  };
}

function offerServiceWorkerUpdate(reg){
  if(!reg || !reg.waiting) return;
  updateBanner.classList.add('show');
  applyUpdateBtn.onclick=()=>reg.waiting?.postMessage({type:'SKIP_WAITING'});
}

if('serviceWorker' in navigator && location.protocol!=='file:'){
  window.addEventListener('load',async()=>{
    try{
      const reg=await navigator.serviceWorker.register('./sw.js',{scope:'./'});
      if(reg.waiting) offerServiceWorkerUpdate(reg);
      reg.addEventListener('updatefound',()=>{
        const worker=reg.installing;
        if(!worker) return;
        worker.addEventListener('statechange',()=>{
          if(worker.state==='installed' && navigator.serviceWorker.controller) offerServiceWorkerUpdate(reg);
        });
      });
      navigator.serviceWorker.addEventListener('controllerchange',()=>window.location.reload());
      // Check for a newer deployment when the planner opens.
      reg.update().catch(()=>{});
    }catch(e){ console.warn('PWA service worker unavailable',e); }
  });
}

render();
</script>
